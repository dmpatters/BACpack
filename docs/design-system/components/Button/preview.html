<!-- @dsCard group="Actions" height=250 subtitle="Primary, secondary, ghost, danger, small, disabled" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body class="bp-body">
  <div class="bp-stack">
    <div class="bp-cluster">
      <button class="bp-btn bp-btn--primary" type="button">Create device</button>
      <button class="bp-btn" type="button">Restart all running devices</button>
      <button class="bp-btn bp-btn--ghost" type="button">Cancel</button>
      <button class="bp-btn" type="button" disabled>Preview</button>
    </div>
    <div class="bp-cluster">
      <button class="bp-btn bp-btn--danger" type="button">Delete device</button>
      <button class="bp-btn bp-btn--danger-solid" type="button">Delete 3 objects</button>
      <span class="bp-muted">Quiet red opens the confirmation; solid red only confirms.</span>
    </div>
    <div class="bp-cluster">
      <button class="bp-btn bp-btn--sm" type="button">Stop</button>
      <button class="bp-btn bp-btn--sm" type="button">Edit</button>
      <button class="bp-btn bp-btn--sm bp-btn--delete" type="button">Delete</button>
      <span class="bp-muted">Row actions: small, delete turns red on hover or focus.</span>
    </div>
  </div>
</body>
</html>
