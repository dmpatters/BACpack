name: CI

on:
  push:
    # release/**: a release branch's push is what starts its CI. A workflow_dispatch
    # can't on a first release: GitHub registered no workflow from the first push
    # into an empty repo, and dispatch only finds registered ones.
    branches: [main, 'release/**']
    # A push touching only docs runs nothing. Not on pull_request: a required
    # check skipped by a path filter would leave the PR waiting forever.
    paths-ignore: ['**.md', 'docs/**']
  # labeled: adding ci-windows to a PR runs the Windows job alone.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A label's run gets its own group, so it doesn't cancel the push's run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  # Windows bills double and the local Windows suite runs before every PR, so
  # on a PR it runs only with the ci-windows label (add it when ready to merge).
  backend-windows:
    name: backend (windows-latest, Python 3.14)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-windows') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci-windows'))
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -rfE -n auto --dist loadgroup

  backend:
    name: backend (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
            constraints: true
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The Ubuntu 3.13 job installs the pinned set the installers ship
      # (packaging/constraints.txt); the others float as early warning.
      - run: python -m pip install ${{ matrix.constraints && '-c packaging/constraints.txt' || '' }} -e ".[dev]"
      # -rfE names any failure or setup error in the summary, so an intermittent
      # one can be traced. loadgroup keeps the tests serving BACnet on fixed UDP
      # ports on one worker (UDP_TEST_FILES in tests/conftest.py).
      - run: python -m pytest -rfE -n auto --dist loadgroup

  frontend:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # No lockfile is committed, so this is npm install, not npm ci.
      - run: npm install
      - run: npm run test
      # Builds to a scratch dir: without a lockfile the hashed output can differ
      # from the committed SPA, so this only checks that the build succeeds.
      - run: npx tsc -b && npx vite build --outDir "$RUNNER_TEMP/spa-check" --emptyOutDir

  spa-committed:
    name: SPA rebuilt with frontend changes
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: every frontend/src commit comes with a rebuilt src/bacpack/web/spa, or says SPA-unchanged
        run: |
          pip install pytest
          # No project config or conftest: the file needs only git and pytest.
          python -m pytest -c /dev/null --rootdir . --noconftest -p no:cacheprovider tests/test_spa_committed.py
