name: Feature request
description: Something BACpack should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
      description: The job you need done, not the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today
      description: The workaround, or the tool you use instead.
