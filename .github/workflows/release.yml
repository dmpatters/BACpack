name: Release

on:
  push:
    tags: ["v*"]
  # A PR that changes packaging builds and smoke-tests the bundle too.
  pull_request:
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

# The build runs a PR's own build_bundle.ps1, so it gets a read-only token;
# only the tag-only release job can write.
permissions:
  contents: read

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Builds the bundle zip, then the setup wizard from the same bundle.
      - run: powershell -NoProfile -File packaging\windows\build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            dist/BACpack-*-windows-x64.zip
            dist/BACpack-*-setup.exe

  # Only a tag makes a release; a PR or manual run stops at the artifact.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/BACpack-*-windows-x64.zip dist/BACpack-*-setup.exe --clobber
